name: Monthly Silo Link Rotation

on:
  schedule:
    - cron: '0 16 1-3 * *'  # midnight SGT (UTC+8) on the 1st, 2nd, and 3rd of each month
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run silo rotation
        run: python3 utilities/silo_linking/generate_silo_rotation.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — already up to date."
          else
            git add *.html
            git commit -m "chore: rotate silo links $(date +%Y-%m)"
            git push
          fi
